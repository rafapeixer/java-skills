spring.application.name=payments

# One JSON object per line on stdout; the platform ships it, nothing parses free text.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=production

# INFO for the service, WARN for chatty frameworks; raise one logger at a time when debugging.
logging.level.root=info
logging.level.org.springframework=warn

# Bound what one exception costs the log pipeline.
logging.structured.json.stacktrace.max-length=4096
