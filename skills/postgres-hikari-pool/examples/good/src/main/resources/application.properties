# The same pool through Spring Boot. This service gets 200 connections and runs
# at most 6 replicas plus 2 surge pods during a deploy: 200 / 8 = 25 per pod.
spring.datasource.hikari.maximum-pool-size=25
# minimum-idle is left unset: a fixed-size pool.
# 30 s below the proxy's 30-minute connection limit.
spring.datasource.hikari.max-lifetime=1770000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.validation-timeout=250
spring.datasource.hikari.data-source-properties.ApplicationName=orders-api
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.socketTimeout=60
