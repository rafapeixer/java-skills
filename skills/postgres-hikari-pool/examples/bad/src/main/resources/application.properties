# MISTAKE: one connection per Tomcat thread. 200 per pod x 8 pods during a deploy
# is 1,600 connections against a budget of 200: "too many clients" mid-rollout.
spring.datasource.hikari.maximum-pool-size=200
# MISTAKE: a flexible pool. Under a burst it opens connections exactly when the
# database is busiest, and idle-timeout closes them again a few minutes later.
spring.datasource.hikari.minimum-idle=10
# MISTAKE: one hour, longer than the proxy's 30-minute limit. The proxy cuts the
# connection first and the next borrower gets a dead socket.
spring.datasource.hikari.max-lifetime=3600000
# MISTAKE: a full pool makes each request wait 60 s for a connection.
spring.datasource.hikari.connection-timeout=60000
