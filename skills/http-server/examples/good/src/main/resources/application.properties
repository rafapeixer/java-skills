spring.application.name=orders

# Errors as RFC 9457 application/problem+json (off by default).
spring.mvc.problemdetails.enabled=true

# Handlers run on virtual threads; server.tomcat.threads.max no longer applies, so nothing
# caps in-flight requests but AdmissionFilter (orders.max-in-flight, default 256).
spring.threads.virtual.enabled=true

# Time to wait for the request line (and between body packets) before dropping the client.
server.tomcat.connection-timeout=5s
# Idle time between requests on a kept-alive connection: longer than the load balancer's.
server.tomcat.keep-alive-timeout=65s
# Listen backlog for connections Tomcat has not accepted yet (default 100). A proxy that
# opens connections in bursts overflows 100, the kernel drops the SYN and the client
# retries after about 1 s. Keep it below net.core.somaxconn, which caps it.
server.tomcat.accept-count=1024

# Multipart and form posts are the only bodies with a built-in limit; keep them tight.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=64KB

# Graceful shutdown is on by default. preStop sleep + this must fit the grace period (30s).
spring.lifecycle.timeout-per-shutdown-phase=15s

# /livez and /readyz on the main port, for the orchestrator's probes.
management.endpoint.health.probes.add-additional-paths=true

spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1
