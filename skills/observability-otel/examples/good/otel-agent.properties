# Read by the OpenTelemetry Java agent 2.32.0:
#   java -javaagent:/otel/opentelemetry-javaagent.jar \
#        -Dotel.javaagent.configuration-file=/otel/otel-agent.properties -jar app.jar
# System properties and OTEL_* environment variables override these values.
otel.service.name=checkout
otel.resource.attributes=service.namespace=shop,deployment.environment.name=production
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.1
otel.exporter.otlp.endpoint=http://otel-collector:4318
otel.exporter.otlp.protocol=http/protobuf
