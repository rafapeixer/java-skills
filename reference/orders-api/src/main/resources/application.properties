spring.application.name=orders-api
spring.main.banner-mode=off
logging.structured.format.console=ecs

server.port=${PORT:8080}
# Required: the service refuses to start without them.
database.url=${DATABASE_URL}
pricing.url=${PRICING_URL}

# Virtual threads remove Tomcat's thread cap; AdmissionFilter is the in-flight cap instead.
spring.threads.virtual.enabled=true
server.tomcat.connection-timeout=5s
# Above the ALB's default 60 s idle timeout, or reused connections fail with 502s.
server.tomcat.keep-alive-timeout=65s
server.tomcat.accept-count=1024

# On SIGTERM: /healthz turns 503 for shutdown.drain while traffic still flows, then Tomcat stops
# accepting and in-flight requests get up to 20 s. 5 s + 20 s fits a 30 s stop timeout
# (ECS default; with plain docker run use --stop-timeout 30).
server.shutdown=graceful
shutdown.drain=${SHUTDOWN_DRAIN:5s}
spring.lifecycle.timeout-per-shutdown-phase=20s

# Our own API contract is strict: a misspelled field is a 400, not silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true
