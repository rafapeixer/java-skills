name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/validate.sh

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor (newest LTS) and the newest release.
        jdk: ["25", "27"]
    steps:
      - uses: actions/checkout@v7
      - name: Run examples in the Maven + Temurin image
        run: JDK_VERSIONS=${{ matrix.jdk }} bash scripts/test-examples.sh

  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: ["25", "27"]
    steps:
      - uses: actions/checkout@v7
      - name: mvn verify in reference/orders-api, in the Maven + Temurin image
        # Testcontainers in the build container starts postgres:17 through the host's Docker socket.
        run: |
          docker run --rm \
            -v "$PWD/reference/orders-api":/work -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --add-host=host.docker.internal:host-gateway \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            maven:3.10-eclipse-temurin-${{ matrix.jdk }} mvn -B -ntp verify
