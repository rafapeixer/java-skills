spring.application.name=orders-api
spring.main.banner-mode=off
server.port=${PORT:8080}

pricing.url=${PRICING_URL}

# Every request on its own virtual thread; the Hikari pool (8) bounds database work and
# QuoteService bounds pricing work.
spring.threads.virtual.enabled=true

# SIGTERM: stop accepting, let in-flight requests finish for up to 20 s. Keep the
# orchestrator's stop timeout (docker stop -t / ECS stopTimeout) above this.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.tomcat.connection-timeout=5s
# Above the load balancer's 60 s idle timeout, so it never reuses a connection we just closed.
server.tomcat.keep-alive-timeout=65s
server.tomcat.accept-count=1024

# No static content: unknown paths are 404s rendered by ApiExceptionHandler.
spring.web.resources.add-mappings=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false

logging.structured.format.console=ecs
