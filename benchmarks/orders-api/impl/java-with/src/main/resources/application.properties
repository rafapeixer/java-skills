spring.application.name=orders-api
server.port=${PORT:8080}

# One virtual thread per request; concurrency is bounded by RequestLimitsFilter,
# the connection pool and the pricing semaphore instead of a Tomcat thread pool.
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

# SIGTERM: stop accepting, let in-flight requests finish. Requests are bounded by the
# 3 s quote budget and 5 s transaction timeouts, so 8 s fits inside Docker's default
# 10 s stop timeout (raise both together if needed).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s

# Short wait for a silent client; keep-alive above the 60 s ALB idle timeout to avoid 502s.
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=65s

# No static content: unknown paths are a 404 from the API's own error handler.
spring.web.resources.add-mappings=false

# Our own request contract: a misspelled field is a client error, not silently dropped.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.factory.constraints.read.max-document-length=65536
spring.jackson.factory.constraints.read.max-string-length=10000
spring.jackson.factory.constraints.read.max-nesting-depth=16

logging.structured.format.console=ecs

orders.database-url=${DATABASE_URL}
# 80 connections / (8 replicas + 8 surge during a rolling deploy) = 5 per replica.
orders.db.pool-size=${DB_POOL_SIZE:5}
pricing.url=${PRICING_URL}
